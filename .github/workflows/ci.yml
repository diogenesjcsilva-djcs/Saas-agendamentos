name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "security/fix-auth-authorization", "test/isolated-postgres-integration"]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Production build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scheduler_test
          POSTGRES_PASSWORD: scheduler_test_only
          POSTGRES_DB: scheduler_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scheduler_test -d scheduler_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: production
      DATABASE_URL: postgres://scheduler_test:scheduler_test_only@localhost:5432/scheduler_test
      DATABASE_SSL: "false"
      JWT_SECRET: integration-test-secret-at-least-32-characters-long
      PORT: 3000
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build production application
        run: npm run build
      - name: Create schema in isolated PostgreSQL
        run: npm run db:migrate
      - name: Start application
        run: |
          npm start > /tmp/scheduler-server.log 2>&1 &
          echo $! > /tmp/scheduler-server.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/tenants >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          cat /tmp/scheduler-server.log
          exit 1
      - name: Run API integration and tenant-isolation tests
        run: node --test test/integration/*.test.mjs
      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/scheduler-server.log
